name: Deploy to Cloudflare Workers

on:
  workflow_run:
    workflows: ["CI — Build & Test Suite"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

concurrency:
  group: cloudflare-deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    name: Build, sync artifacts, and deploy
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify TypeScript types
        run: npm run typecheck

      - name: Run Vitest Suite
        run: |
          npm run content:shard
          npm test

      - name: Cache R2 sync hash
        uses: actions/cache@v4
        with:
          path: .build-artifacts/r2/.last-synced-hash
          key: r2-sync-hash-${{ hashFiles('src/data/json/**', 'content/**') }}

      - name: Check Cloudflare credentials
        id: check-creds
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -n "$CLOUDFLARE_API_TOKEN" ] && [ -n "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
            echo "Cloudflare credentials detected in repository secrets."
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::warning::CLOUDFLARE_API_TOKEN and/or CLOUDFLARE_ACCOUNT_ID are not set in GitHub repository secrets. Skipping remote Cloudflare deployment. Build verification will proceed."
          fi

      - name: Build, publish artifacts, and deploy
        if: steps.check-creds.outputs.configured == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          NODE_OPTIONS: "--max-old-space-size=4096"
        run: npm run deploy:cf

      - name: Validate and build without deployment credentials
        if: steps.check-creds.outputs.configured != 'true'
        env:
          NODE_OPTIONS: "--max-old-space-size=4096"
        run: npm run build
