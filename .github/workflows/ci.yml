name: CI — Build & Test Suite

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # ──────────────────────────────────────────────────────────────────────────
  # JOB 1: Code Quality & Type Integrity
  # ──────────────────────────────────────────────────────────────────────────
  lint-and-typecheck:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Run TypeScript typecheck
        run: npm run typecheck

  # ──────────────────────────────────────────────────────────────────────────
  # JOB 2: Automated Vitest Suite (Unit, Component, Data Integrity & Routes)
  # ──────────────────────────────────────────────────────────────────────────
  unit-and-component:
    name: Unit & Component Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate artifacts required by integration tests
        run: npm run content:shard

      - name: Run Vitest Suite
        run: npm test

      - name: Verify Zero Web-Reachable PDFs
        run: npm run check:no-pdfs

  # ──────────────────────────────────────────────────────────────────────────
  # JOB 3: Production Build Verification (OpenNext on Cloudflare Workers)
  # ──────────────────────────────────────────────────────────────────────────
  build:
    name: Next.js Production Build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build Cloudflare Worker
        env:
          NODE_OPTIONS: "--max-old-space-size=4096"
        run: npm run build

      - name: Verify Zero PDFs in Built OpenNext Assets
        run: npm run check:no-pdfs -- --require-built

  # ──────────────────────────────────────────────────────────────────────────
  # JOB 3B: Playwright Link, Redirect & Tab Hydration Crawl
  # ──────────────────────────────────────────────────────────────────────────
  e2e-crawl:
    name: Playwright Link & Tab Crawl
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate shards and build Next.js app
        env:
          NODE_OPTIONS: "--max-old-space-size=4096"
        run: npm run content:shard && npm run build:next

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run Playwright link and tab crawl
        run: npm run test:e2e

  # ──────────────────────────────────────────────────────────────────────────
  # JOB 4: Centralized Handbook Guardrails
  # ──────────────────────────────────────────────────────────────────────────
  handbook-ci:
    uses: santoshjammi29/.github/.github/workflows/handbook-ci.yml@v1
    with:
      # moderndataengineer is the Next.js/Cloudflare web hub using ecosystem-manifest.json instead of manifest.json.
      require_manifest: false
      # Core JSON banks (up to 5.8 MB) and 11 published A4 PDFs exceed 500 KB.
      max_file_kb: 12000
